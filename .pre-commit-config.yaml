# Pre-commit hooks — farmed from high-quality repos (pydantic-ai, aider, etc.)
# Local mechanical enforcement of the repo-hygiene practices. Install with:
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: no-commit-to-branch # prevent direct commits to main
        args: [--branch, main]
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]
      - id: mixed-line-ending
      - id: forbid-submodules
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
  - repo: local
    hooks:
      - id: repo-hygiene
        name: Repo hygiene (secrets, JSON/TOML/YAML validity)
        entry: python3 scripts/repo-hygiene.py
        language: system
        pass_filenames: false
