name: check

# Structural integrity + whitespace. Farmed best practices from high-quality
# repos: path filtering (only run on relevant changes), concurrency
# cancel-in-progress, upload failure logs as artifacts, workflow annotations.

on:
  push:
    branches: [main]
    paths:
      - '.pi/**'
      - 'scripts/**'
      - '.github/**'
  pull_request:
    paths:
      - '.pi/**'
      - 'scripts/**'
      - '.github/**'
      - '!.github/workflows/check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Whitespace check
        run: git diff --check HEAD~1 || git diff --check
      - name: Structural integrity
        id: integrity
        run: |
          python3 scripts/check-integrity.py 2>&1 | tee /tmp/check-integrity.log
      - name: Repo hygiene
        id: hygiene
        run: |
          python3 scripts/repo-hygiene.py 2>&1 | tee /tmp/repo-hygiene.log
      - name: Upload check log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: |
            /tmp/check-integrity.log
            /tmp/repo-hygiene.log
          retention-days: 2
