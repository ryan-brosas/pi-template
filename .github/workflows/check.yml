name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Whitespace check
        run: git diff --check HEAD~1 || git diff --check
      - name: Skill catalog parity
        run: |
          python3 - <<'EOF'
          import json, os
          d = json.load(open('.pi/skills/packs.json'))
          for p in d['packs']:
              for m in p['members']:
                  if not os.path.isdir(f".pi/skills/{p['id']}/{m}"):
                      raise SystemExit(f"missing member: {p['id']}/{m}")
          print("pack members all resolve")
          EOF
