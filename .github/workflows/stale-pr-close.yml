name: stale-pr-close

# Closes stale PRs (farmed from opencode's close-prs pattern). Safe by
# default: dry-run logs matching PRs without closing them; set dry-run=false
# to actually close. Uses the GitHub API to find PRs with no activity for
# N days.

on:
  schedule:
    - cron: "0 22 * * *" # Daily at 10:00 PM UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Log matching PRs without closing them"
        type: boolean
        default: true
      days:
        description: "Close PRs with no activity for this many days"
        type: string
        required: false
        default: "30"

permissions:
  contents: read
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find and close stale PRs
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run || github.event.inputs.dry-run }}
          DAYS: ${{ github.event.inputs.days || '30' }}
        run: |
          set -euo pipefail
          dry="${DRY_RUN:-true}"
          days="${DAYS:-30}"
          echo "dry-run=$dry, days=$days"
          # List open PRs older than the threshold
          cutoff=$(date -d "-${days} days" +%Y-%m-%d)
          gh pr list --state open --limit 100 --json "number,createdAt" \
            | python3 - -c "$cutoff" -d "$dry" <<'EOF'
          import json, subprocess, sys
          cutoff, dry = sys.argv[1], sys.argv[2] == "true"
          for pr in json.load(sys.stdin):
              created = pr["createdAt"][:10]
              if created < cutoff:
                  print(f"{'DRY-RUN would close' if dry else 'Closing'} PR #{pr['number']} (created {created})")
                  if not dry:
                      subprocess.run(["gh", "pr", "close", str(pr["number"]), "--delete-branch"])
          EOF
