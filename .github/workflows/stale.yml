name: stale

# Auto-closes stale issues and PRs (farmed from graphrag's issues-autoresolve
# pattern using actions/stale). Marks issues/PRs stale after inactivity, then
# closes them after more inactivity. Keeps the issue tracker clean.

on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: "stale"
          close-issue-label: "autoclosed"
          stale-issue-message: "This issue has been marked stale due to inactivity. It will be closed after 7 more days."
          close-issue-message: "This issue was closed after being marked stale. Please reopen if needed."
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: "stale"
          close-pr-label: "autoclosed"
          stale-pr-message: "This PR has been marked stale due to inactivity. It will be closed after 7 more days."
          close-pr-message: "This PR was closed after being marked stale. Please reopen if needed."
          repo-token: ${{ secrets.GITHUB_TOKEN }}
