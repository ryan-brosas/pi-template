name: autofix

# "Let the AI rampage, CI steers outcomes" (mentor Tom):
# This workflow auto-fixes common mechanical issues on PRs and commits the
# fixes back, so the agent can iterate freely and the CI rounds out the edges.
# Currently fixes: trailing whitespace and missing trailing newlines.

on:
  pull_request:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fix whitespace and trailing newlines
        run: |
          # Fix trailing whitespace on tracked text files
          git grep -l '[[:blank:]]$' -- '*.md' '*.json' '*.yml' '*.yaml' '*.py' '*.mjs' '*.ts' || true | \
            xargs -r sed -i 's/[[:blank:]]*$//'
          # Ensure trailing newline on text files
          git grep -l '' -- '*.md' '*.json' '*.yml' '*.yaml' '*.py' '*.mjs' '*.ts' || true | \
            while read -r f; do
              [ -s "$f" ] && [ "$(tail -c1 "$f" | wc -l)" -eq 0 ] && echo >> "$f"
            done

      - name: Commit fixes if any
        run: |
          git config user.name "autofix[bot]"
          git config user.email "autofix[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: autofix whitespace and trailing newlines"
            git push
            echo "Autofix committed."
          else
            echo "No fixes needed."
          fi
