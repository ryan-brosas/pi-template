name: Pull Request Labeler

# Auto-labels PRs based on changed files (farmed from modelcontextprotocol's
# labeler.yml). Uses .github/labeler.yml for the path-to-label mapping.

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: false
